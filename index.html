  <!-- Runs before first paint so the page opens in the visitor's time-of-day theme without a flash. -->
  <script>
    try {
      var preference = localStorage.getItem('portfolio-theme-pref') || 'auto';
      var preview = new URLSearchParams(location.search).get('time');
      var hour = new Date().getHours();
      var dark = preference === 'auto' ? (preview ? preview === 'evening' || preview === 'night' : hour < 5 || hour >= 17) : preference === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#121212' : '#f6f6f4';
    } catch (error) {}
  </script>
</head>
